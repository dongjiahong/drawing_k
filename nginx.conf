server {
    listen 80;
    # listen 443 ssl;
    # server_name kline.example.com;

    root /var/www/drawing_k;
    index index.html;

    # ssl_certificate     /etc/nginx/certs/kline.example.com.crt;
    # ssl_certificate_key /etc/nginx/certs/kline.example.com.key;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
